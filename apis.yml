name: Betty Labs
description: >-
  Betty Labs was the startup behind Locker Room, a live-audio app that launched focused on
  live sports conversations before broadening into general social audio. Backed by Lightspeed Venture
  Partners, the company was acquired by Spotify in 2021, after which Locker Room was rebuilt into Spotify's
  live-audio product (Greenroom / Spotify Live). Betty Labs no longer operates as an independent company;
  its primary domain (bettylabs.io) now redirects to Spotify, and it publishes no independent developer
  portal, API, documentation, or other public developer surface of its own. This profile is retained in
  the API Evangelist network as an acquired-company lead with no active API footprint.
